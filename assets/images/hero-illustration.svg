<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative shapes -->
  <circle cx="300" cy="250" r="180" fill="url(#gradPrimary)" opacity="0.08" />
  <circle cx="420" cy="160" r="100" fill="url(#gradAccent)" opacity="0.1" />

  <!-- Core Brain / Mind Icon Representation -->
  <g transform="translate(150, 100)">
    <!-- Circuit & Connection Nodes -->
    <path d="M50,150 Q100,50 150,120 T250,140" fill="none" stroke="#4F46E5" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
    <path d="M70,220 Q150,180 200,240 T280,200" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="4 4" opacity="0.7"/>
    <path d="M100,100 L200,200" fill="none" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M200,100 L100,200" fill="none" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Central Brain Node Shape -->
    <rect x="90" y="80" width="120" height="140" rx="60" fill="url(#gradPrimary)" filter="url(#glow)" opacity="0.9" />

    <!-- Brain Fold Highlights -->
    <path d="M120,110 C130,95 170,95 180,110 C170,135 130,135 120,160 C135,175 165,175 180,190" 
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="150" cy="150" r="8" fill="#FCD34D" />

    <!-- Connected Skill Nodes -->
    <!-- Node 1: Critical Thinking (Top Left) -->
    <circle cx="30" cy="60" r="28" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3" />
    <path d="M22,60 L28,66 L38,54" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Node 2: Logic & Problem Solving (Top Right) -->
    <circle cx="270" cy="70" r="28" fill="#FFFFFF" stroke="#06B6D4" stroke-width="3" />
    <circle cx="270" cy="70" r="10" fill="none" stroke="#06B6D4" stroke-width="3" />
    <line x1="270" y1="52" x2="270" y2="58" stroke="#06B6D4" stroke-width="3"/>
    <line x1="270" y1="82" x2="270" y2="88" stroke="#06B6D4" stroke-width="3"/>

    <!-- Node 3: Creativity (Bottom Left) -->
    <circle cx="40" cy="240" r="28" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" />
    <polygon points="40,225 45,237 57,237 47,245 51,257 40,249 29,257 33,245 23,237 35,237" fill="#F59E0B"/>

    <!-- Node 4: Memory & Focus (Bottom Right) -->
    <circle cx="260" cy="230" r="28" fill="#FFFFFF" stroke="#EC4899" stroke-width="3" />
    <circle cx="260" cy="230" r="14" fill="#EC4899" opacity="0.3" />
    <circle cx="260" cy="230" r="6" fill="#EC4899" />
  </g>

  <!-- Personalized Learning Path Line (Bottom Timeline) -->
  <path d="M80,410 C 200,360 400,440 520,390" fill="none" stroke="url(#gradPrimary)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Waypoints on Path -->
  <circle cx="100" cy="405" r="12" fill="#4F46E5" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="250" cy="385" r="12" fill="#06B6D4" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="390" cy="415" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="510" cy="392" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Milestone Indicators / Text -->
  <text x="100" y="445" font-family="sans-serif" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">1. Đánh giá</text>
  <text x="250" y="445" font-family="sans-serif" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">2. Phân tích</text>
  <text x="390" y="445" font-family="sans-serif" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">3. Lộ trình</text>
  <text x="510" y="445" font-family="sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="middle">4. Thành công</text>
</svg>
